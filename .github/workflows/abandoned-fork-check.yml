#   Workflow to check for unofficial forks of Cura in new issues and post a comment redirecting users to the official version.
#   FORK DEFINITIONS
#   Add a new entry here to handle another unofficial fork.
#       Each entry requires:
#         name        - Human-readable fork name (used in logs)
#         versions    - Array of regex patterns matching the version(s) used by this fork
#         keywords    - Array of regex patterns matching the brand/printer keywords
#         comment     - Array of strings (joined with \n) for the comment body

name: Unofficial Fork Check
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  checkUnofficialFork:
    runs-on: ubuntu-latest
    steps:
      - name: Detect unofficial fork and post redirect comment
        uses: actions/github-script@v9
        with:
          script: |
            const FORK_RULES = [
              {
                name: "Elegoo",
                versions: [/\b5\.6(\.\d+)?\b/],
                keywords: [/elegoo/i],
                comment: [
                  "## ⚠️ It looks like you may be using an unofficial fork of Cura",
                  "We noticed your issue mentions **Cura 5.6** and an **Elegoo printer**. Elegoo distributes their own modified fork of Cura based on version 5.6, which is **not maintained or supported by UltiMaker**.",
                  "We are not responsible for any issues, bugs, or unexpected behavior in Elegoo's version of Cura. We cannot help with problems that originate from their fork.",
                  "A lot has changed since 5.6, including many bug fixes and improvements.",
                  "### What you can do",
                  "If you want to use the official, up-to-date version of Cura (which supports Elegoo printers), you can download it here:",
                  "➡️ **[Download the latest official Cura](https://github.com/Ultimaker/Cura/releases/latest)**",
                  "If after switching to the official version you still experience this issue, feel free to reopen or submit a new report and we'll be happy to help.",
                  "Slicing failure reports must include a project file or a 'Package for Technical Support'.",
                  "",
                  "This message is automatically generated by the UltiMaker Cura GitHub reposiory based on similar reported issues mentioning Elegoo printers and Cura 5.6. If you believe this is a mistake, please let us know in the comments below.",
                  "Internal-reference: [Cura 5.6 Fork, Elegoo]",
                ],
              }
            ];

            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const fullText = (issue.title || "").toLowerCase() + " " + (issue.body || "").toLowerCase();

            console.log(`Processing issue #${issueNumber}: "${issue.title}"`);

            for (const rule of FORK_RULES) {
                const matchesVersion = rule.versions.some(re => re.test(fullText));
                const matchesKeyword = rule.keywords.some(re => re.test(fullText));

                if (matchesVersion && matchesKeyword) {
                    console.log(`Issue #${issueNumber} matched fork rule "${rule.name}". Checking for existing bot comment.`);

                    const existingComments = await github.paginate(github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                    });

                    const alreadyCommented = existingComments.some(
                        c => c.user.type === "Bot" && c.body.includes("Internal-reference: [Cura 5.6 Fork, Elegoo]")
                    );

                    if (alreadyCommented) {
                        console.log(`Issue #${issueNumber} already has a bot comment for rule "${rule.name}". Skipping.`);
                        break;
                    }

                    await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                        body: rule.comment.join("\n"),
                    });

                    await github.rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                        labels: ["Status: Not UltiMaker Cura"],
                    });

                    console.log(`Comment posted and label added to issue #${issueNumber}.`);
                    // Stop after the first matching rule to avoid duplicate comments.
                    break;
                } 
                else {
                    console.log(`Issue #${issueNumber} did not match fork rule "${rule.name}" (version: ${matchesVersion}, keyword: ${matchesKeyword}).`);
                }
            }
