#   Workflow to triage new issues: detect unofficial Cura forks and flag slicing
#   errors that are missing a project file.
#
#   RULE DEFINITIONS
#   ─────────────────────────────────────────────────────────────────────────────
#   FORK_RULES    – Match by version + keyword patterns. Fork rules are checked
#                   first. If one matches, all GENERAL_RULES are skipped for that
#                   issue (fork takes priority).
#
#     Each entry requires:
#       name        - Human-readable fork name (used in logs)
#       versions    - Array of regex patterns matching the version(s)
#       keywords    - Array of regex patterns matching brand/printer keywords
#       internalRef - Unique string used for bot-comment deduplication
#       labels      - Labels to apply when the rule fires
#       comment     - Array of strings (joined with \n) for the comment body
#
#   GENERAL_RULES – Arbitrary predicate-based rules, evaluated only when no fork
#                   rule matched.
#
#     Each entry requires:
#       name        - Human-readable rule name (used in logs)
#       internalRef - Unique string used for bot-comment deduplication
#       labels      - Labels to apply when the rule fires
#       match       - JS function (issue) => bool
#       comment     - Array of strings (joined with \n) for the comment body

name: Issue Triage
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Run triage rules
        uses: actions/github-script@v9
        with:
          script: |
            const FORK_RULES = [
              {
                name: "Elegoo",
                versions: [/\b5\.6(\.\d+)?\b/],
                keywords: [/elegoo/i],
                internalRef: "Cura 5.6 Fork, Elegoo",
                labels: ["Status: Not UltiMaker Cura"],
                comment: [
                  "## ⚠️ It looks like you may be using an unofficial fork of Cura",
                  "We noticed your issue mentions **Cura 5.6** and an **Elegoo printer**. Elegoo distributes their own modified fork of Cura based on version 5.6, which is **not maintained or supported by UltiMaker**.",
                  "We are not responsible for any issues, bugs, or unexpected behavior in Elegoo's version of Cura. We cannot help with problems that originate from their fork.",
                  "A lot has changed since 5.6, including many bug fixes and improvements.",
                  "### What you can do",
                  "If you want to use the official, up-to-date version of Cura (which supports Elegoo printers), you can download it here:",
                  "➡️ **[Download the latest official Cura](https://github.com/Ultimaker/Cura/releases/latest)**",
                  "If after switching to the official version you still experience this issue, feel free to reopen or submit a new report and we'll be happy to help.",
                  "Slicing failure reports must include a project file or a 'Package for Technical Support'.",
                  "",
                  "This message is automatically generated by the UltiMaker Cura GitHub repository based on similar reported issues mentioning Elegoo printers and Cura 5.6. If you believe this is a mistake, please let us know in the comments below.",
                ],
              },
            ];

            const GENERAL_RULES = [
              {
                name: "Slicing Error - Missing Project File",
                internalRef: "Slicing Error - Missing Project File",
                labels: ["Status: Needs Info"],
                match: (issue) => {
                  const bodyText = issue.body || "";
                  const hasSlicingErrorLabel = issue.labels.some(label => label.name.toLowerCase().includes("slicing error"));
                  const titleContainsSliceFailed = (issue.title || "").toLowerCase().includes("slice failed");
                  const bodyContainsSliceFailed = bodyText.toLowerCase().includes("slice failed");
                  if (!hasSlicingErrorLabel && !titleContainsSliceFailed && !bodyContainsSliceFailed) {
                    return false;
                  }
                  const zipRegex = /(\[[^\]]*?\]\(.*?\.zip\)|https?:\/\/[^\s]*?\.zip)/i;
                  return !zipRegex.test(bodyText);
                },
                comment: [
                  "This issue is related to a slicing error, but it seems a project file (`.zip`) is missing.",
                  "Please attach a `.zip` file containing your project (including models and profiles) so we can reproduce the issue.",
                  "This will help us investigate and resolve the problem more effectively.",
                  "### For Cura version under 5.7.x:",
                  "Update to the latest available Cura version first and see if the issue is resolved.",
                  "Latest Cura version available from: https://github.com/Ultimaker/Cura/releases/latest",
                  "### For Cura version 5.7.x:",
                  "It is still recommended to update to a newer version of Cura and check if the issue is resolved.",
                  "Latest Cura version available from: https://github.com/Ultimaker/Cura/releases/latest",
                  "Include a project file that contains the model you're having the issue with as a `.zip` file.",
                  "Go to the `File` menu > `Save Project...`, and save the package.",
                  "Then create a .zip file with the package, attach the `.zip` file to this issue.",
                  "### For Cura version 5.9.x and newer:",
                  "Have Cura open with your project that fails to slice, go to `Help` > `Export Package For Technical Support`, and save the package.",
                  "Then create a .zip file with the package, attach the `.zip` file to this issue.",
                  "If you have already attached a `.zip` file, please ensure it is correctly linked in the issue body.",
                ],
              },
            ];

            async function applyRule(rule, issueNumber) {
              const deduplicationMarker = `Internal-reference: [${rule.internalRef}]`;
              const existingComments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              if (existingComments.some(c => c.user.type === "Bot" && c.body.includes(deduplicationMarker))) {
                console.log(`Issue #${issueNumber}: already has bot comment for rule "${rule.name}". Skipping.`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: rule.comment.join("\n") + "\n" + deduplicationMarker,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: rule.labels,
              });
              console.log(`Issue #${issueNumber}: comment posted and label(s) added for rule "${rule.name}".`);
            }

            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const fullText = (issue.title || "").toLowerCase() + " " + (issue.body || "").toLowerCase();

            console.log(`Processing issue #${issueNumber}: "${issue.title}"`);

            // Fork rules take priority: if one matches, general rules are skipped.
            let forkMatched = false;
            for (const rule of FORK_RULES) {
              const matchesVersion = rule.versions.some(re => re.test(fullText));
              const matchesKeyword = rule.keywords.some(re => re.test(fullText));
              if (matchesVersion && matchesKeyword) {
                console.log(`Issue #${issueNumber}: matched fork rule "${rule.name}".`);
                await applyRule(rule, issueNumber);
                forkMatched = true;
                break;
              }
              console.log(`Issue #${issueNumber}: did not match fork rule "${rule.name}" (version: ${matchesVersion}, keyword: ${matchesKeyword}).`);
            }

            if (!forkMatched) {
              for (const rule of GENERAL_RULES) {
                if (rule.match(issue)) {
                  console.log(`Issue #${issueNumber}: matched general rule "${rule.name}".`);
                  await applyRule(rule, issueNumber);
                  break;
                }
                console.log(`Issue #${issueNumber}: did not match general rule "${rule.name}".`);
              }
            }
